openapi: 3.0.3
info:
  title: MyInvestor API
  version: 1.0.0
  description: |
    HTTP API contract for the MyInvestor backend.
    Authentication uses opaque bearer tokens. Tokens expire 24 hours after
    login and are revoked when the user logs out.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /api/v1/instruments:
    get:
      tags:
        - Instruments
      summary: Каталог и поиск акций MOEX
      description: >
        Возвращает постраничный список акций MOEX (режим торгов TQBR).
        Поиск идёт по тикеру и названию без учёта регистра. Без параметра q
        возвращается весь каталог, отсортированный по тикеру.
      operationId: listInstruments
      parameters:
        - name: q
          in: query
          required: false
          description: Строка поиска по тикеру или названию, не длиннее 100 символов.
          schema:
            type: string
            maxLength: 100
          example: сбер
        - name: limit
          in: query
          required: false
          description: Размер страницы. Значения больше 100 ограничиваются до 100.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: offset
          in: query
          required: false
          description: Сколько записей пропустить с начала списка.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Страница каталога. Если совпадений нет, items пустой массив.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentPage"
              example:
                items:
                  - id: SBER
                    ticker: SBER
                    name: Сбербанк
                total: 1
                limit: 50
                offset: 0
        "400":
          description: Неверный параметр запроса (limit, offset или слишком длинный q).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid limit parameter
        "500":
          description: Непредвиденная ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: internal server error
        "503":
          description: Источник данных (MOEX) временно недоступен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: market data source is temporarily unavailable, please try again later

  /api/v1/health:
    get:
      operationId: getHealth
      summary: Get application health
      responses:
        '200':
          description: The application is running.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - app
                properties:
                  status:
                    type: string
                    enum: [ok]
                  app:
                    type: string
                    example: MyInvestor
              example:
                status: ok
                app: MyInvestor

  /api/v1/schools/register:
    post:
      operationId: registerSchool
      summary: Register a school
      description: Creates the school account. It does not create a student or a student profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, email, password]
              properties:
                login:
                  type: string
                  minLength: 1
                  maxLength: 50
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: From 8 to 1024 bytes.
      responses:
        '201':
          description: The school was created.
          content:
            application/json:
              schema:
                type: object
                required: [school_id, login, email]
                properties:
                  school_id:
                    type: string
                    format: uuid
                  login:
                    type: string
                  email:
                    type: string
                    format: email
        '400':
          description: The request is malformed or contains invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
        '409':
          description: The school email or login is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
        '500':
          description: Registration failed unexpectedly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
        '503':
          description: Too many school registrations are being processed. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
  /api/v1/student/login:
    post:
      operationId: loginStudent
      summary: Start an authenticated session for student
      description: |
        On success, returns an opaque bearer token valid for 24 hours.
        Invalid email and password combinations return the same response
        so the API does not reveal whether an email is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: johndoe@example.com
                password:
                  type: string
                  format: password
                  writeOnly: true
                  example: example-password
            example:
              email: johndoe@example.com
              password: example-password
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - tokenType
                  - expiresIn
                properties:
                  accessToken:
                    type: string
                    description: Opaque bearer token. Treat it as a secret.
                    example: opaque-token-value
                  tokenType:
                    type: string
                    enum: [Bearer]
                  expiresIn:
                    type: integer
                    description: Token lifetime in seconds.
                    example: 86400
              example:
                accessToken: opaque-token-value
                tokenType: Bearer
                expiresIn: 86400
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The email or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid email or password.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/logout:
    post:
      operationId: logout
      summary: End the current session
      description: Revokes the bearer token used for this request.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The session was ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Send the session token in the Authorization header as
        `Authorization: Bearer <token>`. Tokens expire after 24 hours.
        A successful logout revokes the token.
  schemas:
    Instrument:
      type: object
      required: [id, ticker, name]
      properties:
        id:
          type: string
          description: Идентификатор инструмента (сейчас совпадает с тикером SECID).
          example: SBER
        ticker:
          type: string
          description: Биржевой код.
          example: SBER
        name:
          type: string
          description: Отображаемое (краткое) название.
          example: Сбербанк
    InstrumentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Instrument"
        total:
          type: integer
          description: Всего совпадений до применения limit и offset.
          example: 1
        limit:
          type: integer
          description: Фактически применённый размер страницы.
          example: 50
        offset:
          type: integer
          example: 0

    SchoolRegistrationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    User:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        username:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: johndoe@example.com
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: Invalid input data.
  responses:
    BadRequest:
      description: The request body is malformed or contains invalid fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid input data.
    Unauthorized:
      description: The bearer token is missing, invalid, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Authentication required.
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error.
