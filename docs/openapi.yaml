openapi: 3.0.3
info:
  title: MyInvestor API
  version: 1.0.0
  description: |
    HTTP API contract for the MyInvestor backend.
    Authentication uses opaque bearer tokens. Tokens expire 24 hours after
    login and are revoked when the user logs out.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /api/v1/instruments:
    get:
      tags:
        - Instruments
      summary: Каталог и поиск акций MOEX
      description: >
        Возвращает постраничный список акций MOEX (режим торгов TQBR).
        Поиск идёт по тикеру и названию без учёта регистра. Если параметр q
        отсутствует или пуст, возвращается весь каталог, отсортированный по тикеру.
      operationId: listInstruments
      parameters:
        - name: q
          in: query
          required: false
          description: Строка поиска по тикеру или названию, не длиннее 100 рун; более длинное значение даёт 400.
          schema:
            type: string
            maxLength: 100
          example: сбер
        - name: limit
          in: query
          required: false
          description: Размер страницы (по умолчанию 50). Нецелое значение или значение меньше 1 даёт 400; больше 100 ограничивается до 100.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: offset
          in: query
          required: false
          description: Сколько записей пропустить (по умолчанию 0). Нецелое или отрицательное значение даёт 400.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Страница каталога. Если совпадений нет, items пустой массив.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentPage"
              example:
                items:
                  - id: "<ISIN>"
                    ticker: SBER
                    name: Сбербанк
                total: 1
                limit: 50
                offset: 0
        "400":
          description: Неверный параметр запроса (limit, offset или слишком длинный q).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid limit parameter
        "405":
          description: Метод не разрешён. Зарегистрированный HTTP mux возвращает текстовый ответ.
          content:
            text/plain:
              schema:
                type: string
              example: "Method Not Allowed\n"
        "500":
          description: Непредвиденная ошибка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: internal server error
        "503":
          description: Источник данных (MOEX) временно недоступен или биржа отвечает слишком медленно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: market data source is temporarily unavailable, please try again later
        "504":
          description: Истёк дедлайн обработки запроса.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: request timed out, please try again later

  /api/v1/health:
    get:
      operationId: getHealth
      summary: Get application health
      responses:
        '200':
          description: The application is running.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - app
                properties:
                  status:
                    type: string
                    enum: [ok]
                  app:
                    type: string
                    example: MyInvestor
              example:
                status: ok
                app: MyInvestor

  /api/v1/news:
    get:
      operationId: getNews
      summary: Get filtered news from Interfax
      description: |
        Reads the Interfax RSS feed and returns news in the «Экономика» and «Бизнес» categories.
        Items are ordered by publication date descending; items without a
        publication date follow dated items in source order. See docs/news.md
        for source details and record validation rules.
      parameters:
        - name: limit
          in: query
          description: Maximum number of news items to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of matching news items to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Filtered and paginated news items.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [title, link]
                      properties:
                        title:
                          type: string
                        link:
                          type: string
                          format: uri
                        description:
                          type: string
                        pubDate:
                          type: string
                          description: Original RSS publication date.
                  total:
                    type: integer
                    description: Number of matching items before pagination.
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid limit or offset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The RSS source returned invalid XML.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The RSS source is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/instruments/{ticker}/history:
    get:
      operationId: getInstrumentHistory
      summary: Get historical candles for an instrument chart
      description: |
        Returns OHLC candles for one catalog instrument and a chart period.
        The ticker is the SECID from the instrument catalog.
        Prices are decimal strings as received from MOEX. High and low are
        omitted when the source cell is null. An empty candle list is a
        successful response.
      parameters:
        - name: ticker
          in: path
          required: true
          description: Instrument ticker (SECID), for example SBER.
          schema:
            type: string
            minLength: 1
            maxLength: 32
            pattern: '^[A-Za-z0-9._-]+$'
          example: SBER
        - name: period
          in: query
          required: true
          description: Chart period. halfYear is six months.
          schema:
            type: string
            enum: [day, week, month, halfYear, year, fiveYears]
          example: month
      responses:
        '200':
          description: Candles for the requested instrument and period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentHistory'
              example:
                ticker: SBER
                period: day
                candles:
                  - begin: "2026-03-01T09:30:00+03:00"
                    open: "300.5"
                    high: "301"
                    low: "299"
                    close: "300.8"
        '400':
          description: The period is not supported or the instrument ticker is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                period:
                  value:
                    error: unsupported period
                instrument:
                  value:
                    error: invalid instrument
        '503':
          description: MOEX did not return candles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: market data source is temporarily unavailable, please try again later
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/schools/register:
    post:
      operationId: registerSchool
      summary: Register a school
      description: Creates the school account. It does not create a student or a student profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, email, password]
              properties:
                login:
                  type: string
                  minLength: 1
                  maxLength: 50
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: From 8 to 1024 bytes.
      responses:
        '201':
          description: The school was created.
          content:
            application/json:
              schema:
                type: object
                required: [school_id, login, email]
                properties:
                  school_id:
                    type: string
                    format: uuid
                  login:
                    type: string
                  email:
                    type: string
                    format: email
        '400':
          description: The request is malformed or contains invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
        '409':
          description: The school email or login is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
        '500':
          description: Registration failed unexpectedly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
        '503':
          description: Too many school registrations are being processed. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'

  /api/v1/schools/login:
    post:
      operationId: loginSchool
      summary: Start an authenticated session for school
      description: |
        On success, returns an opaque bearer token valid for 24 hours.
        Invalid email and password combinations return the same response
        so the API does not reveal whether an email is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: johndoe@example.com
                password:
                  type: string
                  format: password
                  writeOnly: true
                  example: example-password
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - tokenType
                  - expiresIn
                properties:
                  accessToken:
                    type: string
                    description: Opaque bearer token. Treat it as a secret.
                    example: opaque-token-value
                  tokenType:
                    type: string
                    enum: [Bearer]
                  expiresIn:
                    type: integer
                    description: Token lifetime in seconds.
                    example: 86400
              example:
                accessToken: opaque-token-value
                tokenType: Bearer
                expiresIn: 86400
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The email or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid email or password.
        '503':
          description: Too many school login attempts are being processed. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Too many login attempts are being processed; retry later.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/student/login:
    post:
      operationId: loginStudent
      summary: Start an authenticated session for student
      description: |
        On success, returns an opaque bearer token valid for 24 hours.
        Invalid email and password combinations return the same response
        so the API does not reveal whether an email is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: johndoe@example.com
                password:
                  type: string
                  format: password
                  writeOnly: true
                  example: example-password
            example:
              email: johndoe@example.com
              password: example-password
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - tokenType
                  - expiresIn
                properties:
                  accessToken:
                    type: string
                    description: Opaque bearer token. Treat it as a secret.
                    example: opaque-token-value
                  tokenType:
                    type: string
                    enum: [Bearer]
                  expiresIn:
                    type: integer
                    description: Token lifetime in seconds.
                    example: 86400
              example:
                accessToken: opaque-token-value
                tokenType: Bearer
                expiresIn: 86400
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The email or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid email or password.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/logout:
    post:
      operationId: logout
      summary: End the current session
      description: Revokes the bearer token used for this request.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The session was ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- НОВЫЕ ПУТИ ДЛЯ КОТИРОВОК ---
  /api/v1/quotes:
    get:
      operationId: getQuotesMarket
      summary: Get market snapshot
      description: Returns quotes for all securities in the specified market/board.
      parameters:
        - $ref: '#/components/parameters/EngineParam'
        - $ref: '#/components/parameters/MarketParam'
        - $ref: '#/components/parameters/BoardParam'
      responses:
        '200':
          description: Successful response with a list of quotes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteDTO'
        '400':
          $ref: '#/components/responses/QuoteBadRequest'
        '500':
          $ref: '#/components/responses/QuoteInternalServerError'
        '502':
          $ref: '#/components/responses/QuoteBadGateway'
        '503':
          $ref: '#/components/responses/QuoteServiceUnavailable'
        '504':
          $ref: '#/components/responses/QuoteGatewayTimeout'

  /api/v1/quotes:batch:
    post:
      operationId: getQuotesBatch
      summary: Get quotes for a list of tickers
      description: Returns quotes for a specific list of tickers (e.g., a portfolio).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '200':
          description: Successful response with a list of quotes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteDTO'
        '400':
          $ref: '#/components/responses/QuoteBadRequest'
        '500':
          $ref: '#/components/responses/QuoteInternalServerError'
        '502':
          $ref: '#/components/responses/QuoteBadGateway'
        '503':
          $ref: '#/components/responses/QuoteServiceUnavailable'
        '504':
          $ref: '#/components/responses/QuoteGatewayTimeout'

  /api/v1/quotes/{engine}/{market}/{security}:
    get:
      operationId: getQuoteOne
      summary: Get quote for a single security
      parameters:
        - $ref: '#/components/parameters/EnginePathParam'
        - $ref: '#/components/parameters/MarketPathParam'
        - $ref: '#/components/parameters/SecurityPathParam'
        - $ref: '#/components/parameters/BoardParam'
      responses:
        '200':
          description: Successful response with a single quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDTO'
        '400':
          $ref: '#/components/responses/QuoteBadRequest'
        '404':
          description: Security not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteError'
              example:
                error: not_found
                message: security not found
        '500':
          $ref: '#/components/responses/QuoteInternalServerError'
        '502':
          $ref: '#/components/responses/QuoteBadGateway'
        '503':
          $ref: '#/components/responses/QuoteServiceUnavailable'
        '504':
          $ref: '#/components/responses/QuoteGatewayTimeout'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Send the session token in the Authorization header as
        `Authorization: Bearer <token>`. Tokens expire after 24 hours.
        A successful logout revokes the token.

  parameters:
    EngineParam:
      name: engine
      in: query
      required: true
      description: Exchange engine (e.g., stock, currency).
      schema:
        type: string
        example: stock
    MarketParam:
      name: market
      in: query
      required: true
      description: Market within the engine.
      schema:
        type: string
        example: shares
    BoardParam:
      name: board
      in: query
      required: false
      description: Trading board/mode.
      schema:
        type: string
        example: TQBR
    EnginePathParam:
      name: engine
      in: path
      required: true
      description: Exchange engine.
      schema:
        type: string
        example: stock
    MarketPathParam:
      name: market
      in: path
      required: true
      description: Market within the engine.
      schema:
        type: string
        example: shares
    SecurityPathParam:
      name: security
      in: path
      required: true
      description: Security ticker.
      schema:
        type: string
        example: SBER

  schemas:
    Instrument:
      type: object
      required: [id, ticker, name]
      properties:
        id:
          type: string
          description: ISIN reported by MOEX.
          example: "<ISIN>"
        ticker:
          type: string
          description: Биржевой код.
          example: SBER
        name:
          type: string
          description: Отображаемое (краткое) название.
          example: Сбербанк
    InstrumentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Instrument"
        total:
          type: integer
          description: Всего совпадений до применения limit и offset.
          example: 1
        limit:
          type: integer
          description: Фактически применённый размер страницы.
          example: 50
        offset:
          type: integer
          example: 0

    SchoolRegistrationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    User:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        username:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: johndoe@example.com
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: Invalid input data.
    Candle:
      type: object
      required: [begin, open, close]
      properties:
        begin:
          type: string
          format: date-time
          description: Candle timestamp.
        open:
          type: string
          description: Open price as a decimal string.
          example: "300.5"
        high:
          type: string
          description: High price. Omitted when MOEX sends null.
          example: "301"
        low:
          type: string
          description: Low price. Omitted when MOEX sends null.
          example: "299"
        close:
          type: string
          description: Close price as a decimal string.
          example: "300.8"
    InstrumentHistory:
      type: object
      required: [ticker, period, candles]
      properties:
        ticker:
          type: string
          example: SBER
        period:
          type: string
          enum: [day, week, month, halfYear, year, fiveYears]
        candles:
          type: array
          items:
            $ref: '#/components/schemas/Candle'
    BatchRequest:
      type: object
      additionalProperties: false
      required:
        - engine
        - market
        - tickers
      properties:
        engine:
          type: string
          example: stock
        market:
          type: string
          example: shares
        board:
          type: string
          example: TQBR
        tickers:
          type: array
          items:
            type: string
          example: ["SBER", "GAZP"]

    QuoteDTO:
      type: object
      required:
        - ticker
        - receivedAt
      properties:
        ticker:
          type: string
          description: Security ticker.
          example: SBER
        last:
          type: string
          description: Last price (omitted if no data).
          example: "250.5"
        changePercent:
          type: string
          description: Percent change (omitted if no data).
          example: "+1.25"
        quoteTime:
          type: string
          format: date-time
          description: Time of the last trade (omitted if no data).
          example: "2023-10-25T14:30:00+03:00"
        receivedAt:
          type: string
          format: date-time
          description: Time the data was received from MOEX ISS.
          example: "2023-10-25T14:30:05+03:00"

    QuoteError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Stable error code.
          example: bad_market
        message:
          type: string
          description: Human-readable error description.
          example: 'board "INVALID" not allowed'
  responses:
    BadRequest:
      description: The request body is malformed or contains invalid fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid input data.
    Unauthorized:
      description: The bearer token is missing, invalid, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Authentication required.
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error.

    # --- НОВЫЕ ОТВЕТЫ ДЛЯ КОТИРОВОК ---
    QuoteBadRequest:
      description: The request is malformed or contains invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteError'
    QuoteInternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteError'
    QuoteBadGateway:
      description: Upstream (MOEX ISS) returned invalid data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteError'
    QuoteServiceUnavailable:
      description: Service is unavailable (network issue, rate limit).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteError'
    QuoteGatewayTimeout:
      description: Timeout while requesting upstream.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteError'