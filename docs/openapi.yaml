openapi: 3.0.3
info:
  title: MyInvestor API
  version: 1.0.0
  description: |
    HTTP API contract for the MyInvestor backend.
    Authentication uses opaque bearer tokens. Tokens expire 24 hours after
    login and are revoked when the user logs out.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Get application health
      responses:
        '200':
          description: The application is running.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - app
                properties:
                  status:
                    type: string
                    enum: [ok]
                  app:
                    type: string
                    example: MyInvestor
              example:
                status: ok
                app: MyInvestor

  /api/v1/news:
    get:
      operationId: getNews
      summary: Get filtered news from Interfax
      description: |
        Reads the Interfax RSS feed and returns news in the «Экономика» and «Бизнес» categories.
        Items are ordered by publication date descending; items without a
        publication date follow dated items in source order. See docs/news.md
        for source details and record validation rules.
      parameters:
        - name: limit
          in: query
          description: Maximum number of news items to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of matching news items to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Filtered and paginated news items.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [title, link]
                      properties:
                        title:
                          type: string
                        link:
                          type: string
                          format: uri
                        description:
                          type: string
                        pubDate:
                          type: string
                          description: Original RSS publication date.
                  total:
                    type: integer
                    description: Number of matching items before pagination.
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid limit or offset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The RSS source returned invalid XML.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The RSS source is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/schools/register:
    post:
      operationId: registerSchool
      summary: Register a school
      description: Creates the school account. It does not create a student or a student profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, email, password]
              properties:
                login:
                  type: string
                  minLength: 1
                  maxLength: 50
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: From 8 to 1024 bytes.
      responses:
        '201':
          description: The school was created.
          content:
            application/json:
              schema:
                type: object
                required: [school_id, login, email]
                properties:
                  school_id:
                    type: string
                    format: uuid
                  login:
                    type: string
                  email:
                    type: string
                    format: email
        '400':
          description: The request is malformed or contains invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
        '409':
          description: The school email or login is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
        '500':
          description: Registration failed unexpectedly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
        '503':
          description: Too many school registrations are being processed. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
  /api/v1/schools/login:
    post:
      operationId: loginSchool
      summary: Start an authenticated session for school
      description: |
        On success, returns an opaque bearer token valid for 24 hours.
        Invalid email and password combinations return the same response
        so the API does not reveal whether an email is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: johndoe@example.com
                password:
                  type: string
                  format: password
                  writeOnly: true
                  example: example-password
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - tokenType
                  - expiresIn
                properties:
                  accessToken:
                    type: string
                    description: Opaque bearer token. Treat it as a secret.
                    example: opaque-token-value
                  tokenType:
                    type: string
                    enum: [Bearer]
                  expiresIn:
                    type: integer
                    description: Token lifetime in seconds.
                    example: 86400
              example:
                accessToken: opaque-token-value
                tokenType: Bearer
                expiresIn: 86400
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The email or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid email or password.
        '503':
          description: Too many school login attempts are being processed. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Too many login attempts are being processed; retry later.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/student/login:
    post:
      operationId: loginStudent
      summary: Start an authenticated session for student
      description: |
        On success, returns an opaque bearer token valid for 24 hours.
        Invalid email and password combinations return the same response
        so the API does not reveal whether an email is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: johndoe@example.com
                password:
                  type: string
                  format: password
                  writeOnly: true
                  example: example-password
            example:
              email: johndoe@example.com
              password: example-password
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - tokenType
                  - expiresIn
                properties:
                  accessToken:
                    type: string
                    description: Opaque bearer token. Treat it as a secret.
                    example: opaque-token-value
                  tokenType:
                    type: string
                    enum: [Bearer]
                  expiresIn:
                    type: integer
                    description: Token lifetime in seconds.
                    example: 86400
              example:
                accessToken: opaque-token-value
                tokenType: Bearer
                expiresIn: 86400
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The email or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid email or password.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/logout:
    post:
      operationId: logout
      summary: End the current session
      description: Revokes the bearer token used for this request.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The session was ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Send the session token in the Authorization header as
        `Authorization: Bearer <token>`. Tokens expire after 24 hours.
        A successful logout revokes the token.
  schemas:
    SchoolRegistrationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    User:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        username:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: johndoe@example.com
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: Invalid input data.
  responses:
    BadRequest:
      description: The request body is malformed or contains invalid fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid input data.
    Unauthorized:
      description: The bearer token is missing, invalid, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Authentication required.
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error.
