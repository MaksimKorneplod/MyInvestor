openapi: 3.0.3
info:
  title: MyInvestor API
  version: 1.0.0
  description: |
    HTTP API contract for the MyInvestor backend.
    Authentication uses opaque bearer tokens. Tokens expire 24 hours after
    login and are revoked when the user logs out.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Get application health
      responses:
        '200':
          description: The application is running.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - app
                properties:
                  status:
                    type: string
                    enum: [ok]
                  app:
                    type: string
                    example: MyInvestor
              example:
                status: ok
                app: MyInvestor

  /api/v1/schools/register:
    post:
      operationId: registerSchool
      summary: Register a school
      description: Creates the school account. It does not create a student or a student profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login, email, password]
              properties:
                login:
                  type: string
                  minLength: 1
                  maxLength: 50
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: From 8 to 1024 bytes.
      responses:
        '201':
          description: The school was created.
          content:
            application/json:
              schema:
                type: object
                required: [school_id, login, email]
                properties:
                  school_id:
                    type: string
                    format: uuid
                  login:
                    type: string
                  email:
                    type: string
                    format: email
        '400':
          description: The request is malformed or contains invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
        '409':
          description: The school email or login is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
        '500':
          description: Registration failed unexpectedly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'
        '503':
          description: Too many school registrations are being processed. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolRegistrationError'

  /api/v1/student/login:
    post:
      operationId: loginStudent
      summary: Start an authenticated session for student
      description: |
        On success, returns an opaque bearer token valid for 24 hours.
        Invalid email and password combinations return the same response
        so the API does not reveal whether an email is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: johndoe@example.com
                password:
                  type: string
                  format: password
                  writeOnly: true
                  example: example-password
            example:
              email: johndoe@example.com
              password: example-password
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessToken
                  - tokenType
                  - expiresIn
                properties:
                  accessToken:
                    type: string
                    description: Opaque bearer token. Treat it as a secret.
                    example: opaque-token-value
                  tokenType:
                    type: string
                    enum: [Bearer]
                  expiresIn:
                    type: integer
                    description: Token lifetime in seconds.
                    example: 86400
              example:
                accessToken: opaque-token-value
                tokenType: Bearer
                expiresIn: 86400
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The email or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid email or password.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/logout:
    post:
      operationId: logout
      summary: End the current session
      description: Revokes the bearer token used for this request.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The session was ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- НОВЫЕ ПУТИ ДЛЯ КОТИРОВОК ---
  /api/v1/quotes:
    get:
      operationId: getQuotesMarket
      summary: Get market snapshot
      description: Returns quotes for all securities in the specified market/board.
      parameters:
        - $ref: '#/components/parameters/EngineParam'
        - $ref: '#/components/parameters/MarketParam'
        - $ref: '#/components/parameters/BoardParam'
      responses:
        '200':
          description: Successful response with a list of quotes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteDTO'
        '400':
          $ref: '#/components/responses/QuoteBadRequest'
        '500':
          $ref: '#/components/responses/QuoteInternalServerError'
        '502':
          $ref: '#/components/responses/QuoteBadGateway'
        '503':
          $ref: '#/components/responses/QuoteServiceUnavailable'
        '504':
          $ref: '#/components/responses/QuoteGatewayTimeout'

  /api/v1/quotes:batch:
    post:
      operationId: getQuotesBatch
      summary: Get quotes for a list of tickers
      description: Returns quotes for a specific list of tickers (e.g., a portfolio).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '200':
          description: Successful response with a list of quotes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteDTO'
        '400':
          $ref: '#/components/responses/QuoteBadRequest'
        '500':
          $ref: '#/components/responses/QuoteInternalServerError'
        '502':
          $ref: '#/components/responses/QuoteBadGateway'
        '503':
          $ref: '#/components/responses/QuoteServiceUnavailable'
        '504':
          $ref: '#/components/responses/QuoteGatewayTimeout'

  /api/v1/quotes/{engine}/{market}/{security}:
    get:
      operationId: getQuoteOne
      summary: Get quote for a single security
      parameters:
        - $ref: '#/components/parameters/EnginePathParam'
        - $ref: '#/components/parameters/MarketPathParam'
        - $ref: '#/components/parameters/SecurityPathParam'
        - $ref: '#/components/parameters/BoardParam'
      responses:
        '200':
          description: Successful response with a single quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDTO'
        '400':
          $ref: '#/components/responses/QuoteBadRequest'
        '404':
          description: Security not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteError'
              example:
                error: not_found
                message: security not found
        '500':
          $ref: '#/components/responses/QuoteInternalServerError'
        '502':
          $ref: '#/components/responses/QuoteBadGateway'
        '503':
          $ref: '#/components/responses/QuoteServiceUnavailable'
        '504':
          $ref: '#/components/responses/QuoteGatewayTimeout'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Send the session token in the Authorization header as
        `Authorization: Bearer <token>`. Tokens expire after 24 hours.
        A successful logout revokes the token.
  
  parameters:
    EngineParam:
      name: engine
      in: query
      required: true
      description: Exchange engine (e.g., stock, currency).
      schema:
        type: string
        example: stock
    MarketParam:
      name: market
      in: query
      required: true
      description: Market within the engine.
      schema:
        type: string
        example: shares
    BoardParam:
      name: board
      in: query
      required: false
      description: Trading board/mode.
      schema:
        type: string
        example: TQBR
    EnginePathParam:
      name: engine
      in: path
      required: true
      description: Exchange engine.
      schema:
        type: string
        example: stock
    MarketPathParam:
      name: market
      in: path
      required: true
      description: Market within the engine.
      schema:
        type: string
        example: shares
    SecurityPathParam:
      name: security
      in: path
      required: true
      description: Security ticker.
      schema:
        type: string
        example: SBER

  schemas:
    SchoolRegistrationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    User:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        username:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: johndoe@example.com
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: Invalid input data.
    
    # --- НОВЫЕ СХЕМЫ ДЛЯ КОТИРОВОК ---
    BatchRequest:
      type: object
      additionalProperties: false
      required:
        - engine
        - market
        - tickers
      properties:
        engine:
          type: string
          example: stock
        market:
          type: string
          example: shares
        board:
          type: string
          example: TQBR
        tickers:
          type: array
          items:
            type: string
          example: ["SBER", "GAZP"]

    QuoteDTO:
      type: object
      required:
        - ticker
        - receivedAt
      properties:
        ticker:
          type: string
          description: Security ticker.
          example: SBER
        last:
          type: string
          description: Last price (omitted if no data).
          example: "250.5"
        changePercent:
          type: string
          description: Percent change (omitted if no data).
          example: "+1.25"
        quoteTime:
          type: string
          format: date-time
          description: Time of the last trade (omitted if no data).
          example: "2023-10-25T14:30:00+03:00"
        receivedAt:
          type: string
          format: date-time
          description: Time the data was received from MOEX ISS.
          example: "2023-10-25T14:30:05+03:00"

    QuoteError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Stable error code.
          example: bad_market
        message:
          type: string
          description: Human-readable error description.
          example: 'board "INVALID" not allowed'

  responses:
    BadRequest:
      description: The request body is malformed or contains invalid fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid input data.
    Unauthorized:
      description: The bearer token is missing, invalid, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Authentication required.
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error.

    # --- НОВЫЕ ОТВЕТЫ ДЛЯ КОТИРОВОК ---
    QuoteBadRequest:
      description: The request is malformed or contains invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteError'
    QuoteInternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteError'
    QuoteBadGateway:
      description: Upstream (MOEX ISS) returned invalid data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteError'
    QuoteServiceUnavailable:
      description: Service is unavailable (network issue, rate limit).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteError'
    QuoteGatewayTimeout:
      description: Timeout while requesting upstream.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteError'